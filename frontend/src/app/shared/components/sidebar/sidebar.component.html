@if (isMobileOpen) {
  <div
    class="sidebar-overlay"
    role="button"
    tabindex="0"
    aria-label="Close menu"
    (click)="closeMobile()"
    (keydown.enter)="closeMobile()"
    (keydown.space)="closeMobile()"
  ></div>
}

<button class="mobile-toggle" (click)="openMobile()" aria-label="Open menu">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
    <path d="M4 6h16M4 12h16M4 18h7" stroke-linecap="round"/>
  </svg>
</button>

<aside class="sidebar" [class.collapsed]="layout.isCollapsed()" [class.mobile-open]="isMobileOpen">

  <div class="sidebar-header">
    <a class="sidebar-brand" routerLink="/dashboard" (click)="closeMobile()">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="26" height="26">
        <path d="M12 2L2 7l10 5 10-5-10-5z" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 17l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">BioMech</span>
    </a>
    <button class="collapse-btn" (click)="toggleCollapse()" [title]="layout.isCollapsed() ? 'Expand' : 'Collapse'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
        <path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav" role="navigation">
    @for (item of visibleNavItems; track item.route) {
      <a
        class="sidebar-link"
        [routerLink]="item.route"
        routerLinkActive="active"
        [title]="layout.isCollapsed() ? item.label : ''"
        (click)="closeMobile()"
      >
        <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20">
          <path [attr.d]="item.icon" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="link-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-divider"></div>

    <a
      class="user-section"
      routerLink="/profile"
      (click)="closeMobile()"
      [title]="layout.isCollapsed() ? (currentUser?.firstName + ' ' + currentUser?.lastName) : ''"
    >
      <div class="user-avatar">{{ userInitials }}</div>
      <div class="user-info">
        <span class="user-name">{{ currentUser?.firstName }} {{ currentUser?.lastName }}</span>
        <span class="user-role">{{ roleLabel }}</span>
      </div>
    </a>

    <button class="logout-btn" (click)="logout()" title="Log out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
        <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logout-label">Log out</span>
    </button>
  </div>

</aside>
