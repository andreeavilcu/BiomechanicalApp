@if (confirmSvc.state(); as state) {
  <div class="overlay" role="presentation">

    <button
      class="overlay-backdrop"
      type="button"
      aria-label="Cancel"
      (click)="confirmSvc.respond(false)">
    </button>

    <div class="dialog" role="dialog" aria-modal="true" [attr.aria-label]="state.message">

      <div class="dialog__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="28" height="28">
          <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h2 class="dialog__title">{{ state.message }}</h2>

      @if (state.detail) {
        <p class="dialog__detail">{{ state.detail }}</p>
      }

      <div class="dialog__actions">
        <button class="btn-secondary" (click)="confirmSvc.respond(false)">
          {{ state.cancelLabel ?? 'Cancel' }}
        </button>
        <button class="btn-danger" (click)="confirmSvc.respond(true)">
          {{ state.confirmLabel ?? 'Delete' }}
        </button>
      </div>

    </div>
  </div>
}
